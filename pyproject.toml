[build-system]
requires = ["maturin>=1.0,<2.0"]
# TEMPORARY: restore `build-backend = "maturin"` and drop backend-path before merging into dev.
build-backend = "openssl_build_backend"
backend-path = ["scripts"]

[project]
name = "blasthttp"
dynamic = ["version"]
description = "Offensive-first HTTP library"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"

[tool.maturin]
features = ["python"]

[dependency-groups]
dev = [
    "maturin>=1.10",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff==0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/python"]

[tool.ruff]
line-length = 119
lint.select = ["E", "F"]
lint.ignore = ["E402", "E711", "E713", "E721", "E741", "F403", "F405", "E501"]
