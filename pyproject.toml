[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "blasthttp"
version = "0.3.1"
description = "Offensive-first HTTP library"
license = "GPL-3.0"
requires-python = ">=3.10"

[tool.maturin]
features = ["python"]

[tool.uv]
# maturin manages the package install — don't let uv overwrite it
managed = false

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/python"]
