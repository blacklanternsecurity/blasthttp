# cargo-release configuration
# Usage: cargo release patch|minor|major

# Don't publish to crates.io (private project)
publish = false

# Git tag format
tag-name = "v{{version}}"

# Commit message format
tag-message = "v{{version}}"

# Sign tags if gpg is available
sign-tag = false
sign-commit = false

# Push after release
push-remote = "origin"
