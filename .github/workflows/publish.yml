name: publish

on:
  push:
    tags: ["v*", "!archive/**"]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tag matches the declared version
        run: |
          VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml $VERSION"
            exit 1
          fi

  rust:
    needs: version
    uses: ./.github/workflows/rust-tests.yml

  python:
    needs: version
    uses: ./.github/workflows/python-tests.yml

  linux-build:
    needs: [version, rust, python]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04
            target: x86
          - runner: ubuntu-24.04
            target: aarch64
          - runner: ubuntu-24.04
            target: armv7
          - runner: ubuntu-24.04
            target: s390x
          - runner: ubuntu-24.04
            target: ppc64le
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.10 -i python3.11 -i python3.12 -i python3.13 -i python3.14
          sccache: false
          manylinux: manylinux_2_28
          before-script-linux: |
            set -e
            # Install OpenSSL build dependencies
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache perl make gcc musl-dev linux-headers curl bash
            elif command -v yum >/dev/null 2>&1; then
              yum install -y perl-core 2>/dev/null || true
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y perl make gcc curl 2>/dev/null || true
            fi
            # Build custom OpenSSL with weak cipher support
            ./scripts/build-openssl.sh
            # Override target-specific OPENSSL_DIR env vars set by maturin containers
            # (openssl-sys checks <TARGET>_OPENSSL_DIR before OPENSSL_DIR)
            OPENSSL_INSTALL="$(pwd)/vendor/openssl/install"
            export OPENSSL_DIR="$OPENSSL_INSTALL"
            export OPENSSL_STATIC=1
            export OPENSSL_NO_VENDOR=1
            for var in $(env | grep '_OPENSSL_DIR=' | cut -d= -f1); do
              export "$var=$OPENSSL_INSTALL"
            done
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux-build:
    needs: [version, rust, python]
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-24.04
            target: x86_64
          - runner: ubuntu-24.04
            target: x86
          - runner: ubuntu-24.04
            target: aarch64
          - runner: ubuntu-24.04
            target: armv7
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist -i python3.10 -i python3.11 -i python3.12 -i python3.13 -i python3.14
          sccache: false
          manylinux: musllinux_1_2
          before-script-linux: |
            set -e
            # Install OpenSSL build dependencies
            if command -v apk >/dev/null 2>&1; then
              apk add --no-cache perl make gcc musl-dev linux-headers curl bash
            elif command -v yum >/dev/null 2>&1; then
              yum install -y perl-core 2>/dev/null || true
            elif command -v apt-get >/dev/null 2>&1; then
              apt-get update && apt-get install -y perl make gcc curl 2>/dev/null || true
            fi
            # Build custom OpenSSL with weak cipher support
            ./scripts/build-openssl.sh
            # Override target-specific OPENSSL_DIR env vars set by maturin containers
            OPENSSL_INSTALL="$(pwd)/vendor/openssl/install"
            export OPENSSL_DIR="$OPENSSL_INSTALL"
            export OPENSSL_STATIC=1
            export OPENSSL_NO_VENDOR=1
            for var in $(env | grep '_OPENSSL_DIR=' | cut -d= -f1); do
              export "$var=$OPENSSL_INSTALL"
            done
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  sdist-build:
    needs: [version, rust, python]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: dist

  crates:
    needs: [version, linux-build, musllinux-build, sdist-build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
      - run: ./scripts/build-openssl.sh
      - run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          OPENSSL_DIR: ${{ github.workspace }}/vendor/openssl/install
          OPENSSL_STATIC: "1"
          OPENSSL_NO_VENDOR: "1"

  pypi:
    needs: [version, linux-build, musllinux-build, sdist-build]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'wheels-*/*'
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive wheels-*/*
