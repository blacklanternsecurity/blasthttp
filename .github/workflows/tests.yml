name: Tests

on:
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    uses: blacklanternsecurity/CLA/.github/workflows/python-tests.yml@07e14bcbba5e737e1b29bd9e3f9128fbf2483be9 # CLA#11
    with:
      setup-script: scripts/build-openssl.sh
      env: '{"PYO3_USE_ABI3_FORWARD_COMPATIBILITY": "1"}'

  # Reports the python-tests contexts stable's ruleset requires today. Remove once it requires python / passed.
  required:
    name: ${{ matrix.context }}
    if: always()
    needs: python
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        context: ["python-tests (3.11)", "python-tests (3.12)", "python-tests (3.13)", "python-tests (3.14)", "python-tests (3.15)"]
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
