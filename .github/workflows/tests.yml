name: Tests

on:
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    uses: blacklanternsecurity/release-workflows/.github/workflows/python-tests.yml@4f32510b1cdfe7305aa27daa3f6fd72e4c03c21b # v1.5.0
    with:
      setup-script: scripts/build-openssl.sh
      env: '{"PYO3_USE_ABI3_FORWARD_COMPATIBILITY": "1"}'
