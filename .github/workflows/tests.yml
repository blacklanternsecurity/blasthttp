name: Tests

on:
  pull_request:
  workflow_call:

concurrency:
  group: tests-${{ github.workflow_ref }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  python:
    uses: blacklanternsecurity/release-workflows/.github/workflows/python-tests.yml@c53c202eedeb26a86088936363e6cb06ce99ac15 # v1.0.0
    with:
      setup-script: scripts/build-openssl.sh
      env: '{"PYO3_USE_ABI3_FORWARD_COMPATIBILITY": "1"}'
