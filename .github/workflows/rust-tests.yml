name: Rust Tests

on:
  push:
    branches: [stable]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Cache OpenSSL build
        uses: actions/cache@v6
        with:
          path: vendor/openssl/install
          key: openssl-3.3.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-openssl.sh') }}

      - name: Build custom OpenSSL
        run: ./scripts/build-openssl.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked --verbose

  rust-publish:
    needs: rust-tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/stable'

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Cache OpenSSL build
        uses: actions/cache@v6
        with:
          path: vendor/openssl/install
          key: openssl-3.3.2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-openssl.sh') }}

      - name: Build custom OpenSSL
        run: ./scripts/build-openssl.sh

      - name: Check if version already published
        id: version-check
        run: |
          LOCAL_VERSION=$(cargo metadata --no-deps --format-version 1 | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")
          echo "local=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"
          if curl -sf -o /dev/null -H "User-Agent: blasthttp-ci" "https://crates.io/api/v1/crates/blasthttp/$LOCAL_VERSION"; then PUBLISHED=yes; else PUBLISHED=no; fi
          echo "already_published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "Version $LOCAL_VERSION — already published: $PUBLISHED"

      - name: Publish to crates.io
        if: steps.version-check.outputs.already_published != 'yes'
        env:
          OPENSSL_DIR: ${{ github.workspace }}/vendor/openssl/install
          OPENSSL_STATIC: "1"
          OPENSSL_NO_VENDOR: "1"
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
